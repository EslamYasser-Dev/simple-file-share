openapi: 3.0.3
info:
  title: File Share API
  description: REST API for file listing, upload, download, and directory management.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development
  - url: http://localhost:22010
    description: Docker / production (HTTP behind reverse proxy)
security:
  - basicAuth: []
paths:
  /api/files:
    get:
      summary: List directory contents
      parameters:
        - name: path
          in: query
          schema:
            type: string
            example: ""
      responses:
        "200":
          description: JSON array of file entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileItem"
        "401":
          description: Unauthorized
        "404":
          description: Not a directory
    delete:
      summary: Delete a file or directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        "200":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /api/files/download:
    get:
      summary: Download a file or ZIP archive
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File or ZIP stream
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /api/files/info:
    get:
      summary: Get file or directory metadata
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileItem"
        "404":
          description: Not found

  /api/files/search:
    get:
      summary: Search files and directories by name or path
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            example: report
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Matching file entries (in-memory index)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileItem"
        "400":
          description: Missing or invalid query

  /api/upload:
    post:
      summary: Upload one or more files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                path:
                  type: string
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "413":
          description: Upload exceeds MAX_UPLOAD_BYTES
        "401":
          description: Unauthorized

  /api/directories:
    post:
      summary: Create a directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        "201":
          description: Directory created
        "401":
          description: Unauthorized

  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    FileItem:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        size:
          type: integer
          format: int64
        isDir:
          type: boolean
        modified:
          type: string
          format: date-time
    UploadResult:
      type: object
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        uptime:
          type: string
          example: 2m30s
