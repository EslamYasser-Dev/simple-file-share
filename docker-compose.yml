services:
  file-server:
    build:
      context: .
      dockerfile: dockerfile
    container_name: go-file-server
    ports:
      - "22010:22010"
      - "50051:50051"
    volumes:
      - ./data:/data
    environment:
      APP_ENV: production
      PORT: "22010"
      ROOT_DIR: /data
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: changeme
      ENABLE_SIGNUP: "true"
      ENABLE_GRPC: "true"
      GRPC_PORT: "50051"
      ENABLE_TLS: "false"
      ENABLE_AUTH: "true"
      MAX_UPLOAD_BYTES: "104857600"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:22010/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
