services:
  file-server:
    build:
      context: .
      dockerfile: dockerfile
    container_name: go-file-server
    ports:
      - "22010:22010"
      - "50051:50051"
    volumes:
      # Named volume: Docker initializes it with the image's /data ownership
      # (nobody), which the server requires to lock the storage root to 0700.
      # To use a host bind mount instead, create the directory and chown it to
      # uid/gid 65534 (nobody) first: `mkdir -p data && sudo chown 65534:65534 data`.
      - file-data:/data
    environment:
      APP_ENV: production
      PORT: "22010"
      ROOT_DIR: /data
      # Required: the server refuses to start in production without a random
      # JWT_SECRET of at least 32 characters (generate with `openssl rand -hex 32`).
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random value of at least 32 characters - e.g. openssl rand -hex 32}
      # Required so a production deployment can never fall back to a default login.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD to a strong password for the bootstrap admin}
      ENABLE_SIGNUP: "${ENABLE_SIGNUP:-false}"
      ENABLE_GRPC: "true"
      GRPC_PORT: "50051"
      ENABLE_TLS: "false"
      ENABLE_AUTH: "true"
      MAX_UPLOAD_BYTES: "104857600"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:22010/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  file-data:
