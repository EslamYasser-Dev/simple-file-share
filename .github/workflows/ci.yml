name: CI

on:
  push:
    branches: [ "master", "main", "enhancements" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum

      - name: Verify modules are tidy
        run: |
          go mod download
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | awk '/total:/ {gsub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 20) exit 1 }'

      - name: Coverage report (HTML)
        if: always()
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.html
          if-no-files-found: ignore

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm i; fi

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test --if-present

      # The build is shared by every deployment path below (Actions-based
      # Pages deploy, PR previews, and the gh-pages branch), so it must be
      # baked with the GitHub Pages base path. VITE_API_URL is optional at
      # build time (empty = same-origin) and only enforced before the
      # production deployment.
      - name: Build (with Pages base path)
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          base="${{ vars.VITE_BASE_PATH }}"
          [ -n "$base" ] || base="/${{ github.event.repository.name }}/"
          VITE_BASE_PATH="$base" npm run build --if-present

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload frontend build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: false
          tags: simple-file-share:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Production deployment to GitHub Pages (Actions source).
  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && contains(fromJson('["master","main","enhancements"]'), github.ref_name)
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Warn when VITE_API_URL is unset
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::warning::VITE_API_URL is not set (Settings > Secrets and variables > Actions > Variables). The UI will deploy but cannot reach a backend until it points at the hosted server."
          fi

      - name: Enable GitHub Pages (Actions source)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          if curl -sf -X POST "https://api.github.com/repos/${repo}/pages" "${auth[@]}" \
            --data '{"build_type":"workflow"}' >/dev/null 2>&1; then
            echo "GitHub Pages enabled (source: GitHub Actions)."
          elif curl -sf -X PUT "https://api.github.com/repos/${repo}/pages" "${auth[@]}" \
            --data '{"build_type":"workflow"}' >/dev/null 2>&1; then
            echo "GitHub Pages switched to Actions source."
          else
            echo "::error::GitHub Pages could not be enabled via the API. Open Settings > Pages in the repo and set Source to \"GitHub Actions\", then re-run this workflow."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v5

  # PR preview on GitHub Pages: the latest pushed commit of each pull request
  # is deployed so reviewers can open the built UI. Fork PRs are skipped
  # because they cannot obtain the Pages/ID-token permissions.
  deploy-pages-preview:
    name: Preview on GitHub Pages (PR)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v5

  # Legacy backup: force-push the built UI to the gh-pages branch on every
  # push, for repositories configured with Pages source "Deploy from a
  # branch". Ignored when the Pages source is "GitHub Actions".
  publish-gh-pages:
    name: Publish to gh-pages branch
    if: github.event_name == 'push'
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Push to gh-pages branch
        run: |
          set -euo pipefail
          rm -rf /tmp/gh-pages
          mkdir -p /tmp/gh-pages
          cp -r frontend/dist/* /tmp/gh-pages/
          cd /tmp/gh-pages
          git init -q
          git -c init.defaultBranch=gh-pages checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "deploy: frontend $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin gh-pages