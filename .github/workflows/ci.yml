name: CI

on:
  push:
    branches: [ "master", "main", "enhancements" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum

      - name: Verify modules are tidy
        run: |
          go mod download
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | awk '/total:/ {gsub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 40) exit 1 }'

      - name: Coverage report (HTML)
        if: always()
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.html
          if-no-files-found: ignore

  docker:
    name: Docker image (backend only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ backend ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: false
          load: true
          tags: simple-file-share:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (health + login)
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 22010:22010 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=ci-smoke-password-123 \
            -e ENABLE_TLS=false \
            -e METRICS_TOKEN=ci-smoke-metrics-token \
            simple-file-share:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:22010/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:22010/health >/dev/null
          # Readiness must report storage + index checks before login works.
          curl -sf http://127.0.0.1:22010/health/ready >/dev/null
          # The scrape endpoint must reject anonymous callers but accept the token.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:22010/metrics)
          test "$code" = "401"
          curl -sf -H 'Authorization: Bearer ci-smoke-metrics-token' \
            http://127.0.0.1:22010/metrics | grep -q fileshare_http_requests_total
          # Request ids are stamped on every response for log/trace correlation.
          rid=$(curl -s -D- -o /dev/null -H 'X-Request-Id: ci-trace-12345' \
            http://127.0.0.1:22010/health | awk -F': ' 'tolower($1)=="x-request-id" {print $2}' | tr -d '\r')
          test "$rid" = "ci-trace-12345"
          token=$(curl -sf -X POST http://127.0.0.1:22010/api/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-smoke-password-123"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')
          test -n "$token"
          # API keys: mint a write key, read with it, and prove scope holds
          # (write cannot reach /api/admin; a dead key gets 401).
          key=$(curl -sf -X POST http://127.0.0.1:22010/api/auth/api-keys \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"ci","scope":"write"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          case "$key" in sfs_*) ;; *) echo "bad key: $key"; exit 1;; esac
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $key" \
            'http://127.0.0.1:22010/api/files?path=/')
          test "$code" = "200"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $key" \
            http://127.0.0.1:22010/api/admin/users)
          test "$code" = "403"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer sfs_0123456789abcdef_deadbeefdeadbeefdeadbeefdead' \
            'http://127.0.0.1:22010/api/files?path=/')
          test "$code" = "401"
          # The audit trail must have recorded the login and the key mint.
          curl -sf -H "Authorization: Bearer $token" 'http://127.0.0.1:22010/api/admin/audit?limit=10' \
            | python3 -c 'import json,sys; actions={e["action"] for e in json.load(sys.stdin)["items"]}; missing={"login.ok","apikey.create"}-actions; assert not missing, f"missing audit actions: {missing}"'
          # P4b/c: downloads revalidate (ETag/304) and support byte ranges;
          # list endpoints answer the {"items":[…],"nextCursor":…} envelope.
          echo ci-bytes > ci-smoke.txt
          curl -sf -H "Authorization: Bearer $token" -F 'file=@ci-smoke.txt' \
            http://127.0.0.1:22010/api/upload >/dev/null
          page=$(curl -sf -H "Authorization: Bearer $token" 'http://127.0.0.1:22010/api/files?path=/&limit=1')
          echo "$page" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert isinstance(p,dict) and isinstance(p.get("items"),list),p'
          hdrs=$(curl -sD- -o /dev/null -H "Authorization: Bearer $token" \
            'http://127.0.0.1:22010/api/files/download?path=/ci-smoke.txt')
          etag=$(printf '%s' "$hdrs" | awk -F': ' 'tolower($1)=="etag" {print $2}' | tr -d '\r')
          test -n "$etag"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "If-None-Match: $etag" \
            -H "Authorization: Bearer $token" 'http://127.0.0.1:22010/api/files/download?path=/ci-smoke.txt')
          test "$code" = "304"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-1' \
            -H "Authorization: Bearer $token" 'http://127.0.0.1:22010/api/files/download?path=/ci-smoke.txt')
          test "$code" = "206"
          # P4a: a password-protected, single-use share enforces its policy.
          stoken=$(curl -sf -X POST http://127.0.0.1:22010/api/shares \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"path":"/ci-smoke.txt","password":"ci-share-pw","maxDownloads":1}' \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:22010/api/share/$stoken")
          test "$code" = "401"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Share-Password: ci-share-pw' \
            "http://127.0.0.1:22010/api/share/$stoken")
          test "$code" = "200"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Share-Password: ci-share-pw' \
            "http://127.0.0.1:22010/api/share/$stoken")
          test "$code" = "410"
          echo "image smoke OK"

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true
