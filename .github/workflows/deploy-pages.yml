name: Deploy frontend to GitHub Pages

# GitHub Pages hosts static files only, so this publishes the React UI and
# leaves the Go API to a separate host (Docker/VPS/etc.). Configure the
# repository variable VITE_API_URL with that backend's origin, and optionally
# VITE_BASE_PATH ("/" for user/org pages; defaults to /<repo>/).

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require VITE_API_URL
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::error::Set the repository variable VITE_API_URL to the deployed backend origin (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          base="${{ vars.VITE_BASE_PATH }}"
          [ -n "$base" ] || base="/${{ github.event.repository.name }}/"
          VITE_BASE_PATH="$base" npm run build

      - name: Add SPA fallback and disable Jekyll
        working-directory: frontend
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
